[project]
name = "wrl-dragon"
version = "0.1.0"
description = "RL orchestrator using Claude Code to coordinate sub-agents on OpenEnv environments"
requires-python = ">=3.10"
dependencies = [
    # OpenEnv core
    "openenv-core",

    # Claude API (orchestrator)
    "anthropic>=0.40.0",

    # Web dashboard
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "jinja2>=3.1.0",

    # RL / metrics
    "gymnasium>=1.0.0",
    "numpy>=1.26.0",

    # HTTP client
    "httpx>=0.27.0",

    # Logging & video
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
phase2 = [
    # Phase 2: RL meta-training
    "torch>=2.2.0",
    "trl>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
